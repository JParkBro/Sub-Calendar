# detekt 기본 설정(buildUponDefaultConfig) 위에 덮어쓰는 값만 둔다.
# 규칙 근거: docs/common/CODING_CONVENTIONS.md 1장

complexity:
  LongMethod:
    active: true
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    active: true
    ignoreAnnotated: ['Composable']
  LongParameterList:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    # Room @Database는 DAO마다 abstract getter가 하나씩 있어야 한다
    ignoreAnnotated: ['Database']
    # Repository 구현 · Fake는 인터페이스를 따를 뿐이라 override는 세지 않는다 (docs/subcal/README.md)
    ignoreOverridden: true
    # Repository 인터페이스는 데이터 연산 목록이라 클래스보다 넉넉하게 둔다
    thresholdInInterfaces: 15

coroutines:
  GlobalCoroutineUsage:
    active: true

potential-bugs:
  UnsafeCallOnNullableType:
    active: true
  ElseCaseInsteadOfExhaustiveWhen:
    active: true

style:
  ForbiddenImport:
    active: true
    imports:
      - value: 'android.util.Log'
        reason: '로그 래퍼를 사용한다.'
  MagicNumber:
    ignoreAnnotated: ['Preview', 'ComponentPreviews', 'ScreenPreviews']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview', 'ComponentPreviews', 'ScreenPreviews']

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    # SCREAMING_SNAKE_CASE(기본) + Compose 스타일 PascalCase 둘 다 허용
    constantPattern: '[A-Z][_A-Za-z0-9]*'
