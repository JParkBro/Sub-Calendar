<!-- BEGIN: InteractiveScripts -->
<script data-purpose="plan-amount-toggle">
    document.addEventListener('DOMContentLoaded', () => {
      const priceInput = document.getElementById('price-input');
      const planButtons = document.querySelectorAll('[role="radio"]');

      // Simple UX showcase for plan changing
      planButtons.forEach(btn => {
        btn.addEventListener('click', (e) => {
          const text = btn.innerText;
          if (text.includes('9,900')) {
            if (priceInput) priceInput.value = '9,900';
          } else if (text.includes('13,900')) {
            if (priceInput) priceInput.value = '13,900';
          }
        });
      });
    });
  </script>
